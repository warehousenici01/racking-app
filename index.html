<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rack//Entry</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#161b27;--surface2:#1e2535;
  --accent:#00d9a3;--accent2:#0066ff;--warn:#ff6b35;
  --text:#e8eaf0;--muted:#5a6278;--border:#252d42;
  --radius:8px;--mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100vh;}

.header{background:var(--surface);border-bottom:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.logo{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);letter-spacing:.05em;}
.sid{font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--surface2);padding:3px 8px;border-radius:4px;border:1px solid var(--border);}
.live{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;color:var(--accent);}
.dot{width:6px;height:6px;background:var(--accent);border-radius:50%;animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.3)}}

.main{padding:16px;max-width:700px;margin:0 auto;padding-bottom:80px;}
.sec-lbl{font-family:var(--mono);font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:8px;}

.type-selector{display:flex;gap:8px;margin-bottom:24px;}
.type-btn{flex:1;padding:12px;border-radius:var(--radius);border:2px solid var(--border);background:var(--surface);color:var(--muted);font-family:var(--mono);font-size:12px;cursor:pointer;transition:all .18s;text-align:center;line-height:1.4;}
.type-btn:hover{border-color:var(--muted);color:var(--text);}
.type-btn.active-fg{background:rgba(0,217,163,.12);border-color:var(--accent);color:var(--accent);}
.type-btn.active-rm{background:rgba(0,102,255,.12);border-color:var(--accent2);color:var(--accent2);}
.type-label{font-size:10px;opacity:.7;display:block;margin-top:3px;}

.form-body{position:relative;transition:opacity .2s;}
.form-body.locked{opacity:.35;pointer-events:none;user-select:none;}
.lock-hint{display:none;position:absolute;inset:0;z-index:10;align-items:center;justify-content:center;}
.form-body.locked .lock-hint{display:flex;}
.lock-box{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 22px;text-align:center;}
.lock-icon{font-size:22px;margin-bottom:4px;}
.lock-txt{font-family:var(--mono);font-size:12px;color:var(--muted);}

.meta-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:20px;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;}
.field input,.field select{background:var(--surface);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:13px;padding:8px 11px;border-radius:var(--radius);outline:none;transition:border-color .15s;width:100%;}
.field input:focus,.field select:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--muted);}
.field select option{background:var(--surface2);}

.items-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
.item-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;animation:slideIn .2s ease;}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.item-hdr{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--surface2);border-bottom:1px solid var(--border);}
.item-num{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;}
.item-num.fg{color:var(--accent);}
.item-num.rm{color:var(--accent2);}
.btn-rm-item{background:none;border:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:0 2px;transition:color .15s;}
.btn-rm-item:hover{color:var(--warn);}
.item-body{padding:12px;}

/* Nama barang + supplier row */
.item-fields{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.item-fields-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* BIN SELECTOR */
.bin-selector{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:10px;}
.drill-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:flex-end;}
.drill-field{display:flex;flex-direction:column;gap:4px;}
.drill-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;}
.drill-sel{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:5px;outline:none;}
.drill-sel:focus{border-color:var(--accent);}
.drill-sel option{background:var(--bg);}

/* Default qty input in drill row */
.default-qty-wrap{display:flex;flex-direction:column;gap:4px;}
.default-qty-input{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:6px 8px;border-radius:5px;outline:none;width:64px;}
.default-qty-input:focus{border-color:var(--accent);}

.side-btns{display:flex;gap:4px;height:32px;}
.btn-side{background:rgba(0,217,163,.12);border:1px solid rgba(0,217,163,.3);color:var(--accent);font-family:var(--mono);font-size:11px;padding:0 10px;border-radius:5px;cursor:pointer;transition:all .15s;}
.btn-side:hover{background:rgba(0,217,163,.25);}
.btn-side-both{background:rgba(0,102,255,.12);border-color:rgba(0,102,255,.3);color:var(--accent2);}
.btn-side-both:hover{background:rgba(0,102,255,.25);}
.btn-add-bin-single{background:rgba(0,217,163,.12);border:1px solid rgba(0,217,163,.3);color:var(--accent);font-family:var(--mono);font-size:11px;padding:0 14px;border-radius:5px;cursor:pointer;transition:all .15s;height:32px;}
.btn-add-bin-single:hover{background:rgba(0,217,163,.25);}

.rak-info{font-family:var(--mono);font-size:10px;color:var(--muted);margin-bottom:10px;}
.rak-info span{color:var(--accent);}

/* BIN REVIEW TABLE */
.bins-review{margin-top:8px;}
.bins-review-lbl{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:6px;}
.bins-empty{font-family:var(--mono);font-size:11px;color:var(--muted);padding:4px 0;}

.bin-review-row{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);animation:slideIn .15s ease;}
.bin-review-row:last-child{border-bottom:none;}
.bin-code{font-family:var(--mono);font-size:11px;color:var(--accent);background:rgba(0,217,163,.1);border:1px solid rgba(0,217,163,.2);padding:3px 8px;border-radius:4px;flex:1;white-space:nowrap;}
.bin-qty-input{background:var(--bg);border:1px solid var(--border);color:var(--text);font-family:var(--mono);font-size:12px;padding:5px 8px;border-radius:5px;outline:none;width:72px;text-align:right;}
.bin-qty-input:focus{border-color:var(--accent);}
.bin-qty-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);}
.btn-rm-bin{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:2px 4px;transition:color .15s;flex-shrink:0;}
.btn-rm-bin:hover{color:var(--warn);}

.bin-tally{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:8px;}
.bin-tally span{color:var(--accent);}

.btn-add-item{width:100%;background:none;border:1px dashed var(--border);color:var(--muted);font-family:var(--mono);font-size:12px;padding:11px;border-radius:var(--radius);cursor:pointer;transition:all .15s;letter-spacing:.05em;margin-bottom:20px;}
.btn-add-item:hover{border-color:var(--accent2);color:var(--accent2);background:rgba(0,102,255,.06);}

.summary-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.summary-stats{display:flex;gap:20px;}
.stat-val{font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);line-height:1;}
.stat-lbl{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.08em;}
.btn-submit{border:none;color:#000;font-family:var(--mono);font-size:13px;font-weight:600;padding:11px 24px;border-radius:var(--radius);cursor:pointer;letter-spacing:.05em;transition:all .15s;white-space:nowrap;display:flex;align-items:center;gap:8px;}
.btn-submit.fg{background:var(--accent);}
.btn-submit.fg:hover{background:#00f0b5;transform:translateY(-1px);}
.btn-submit.rm{background:#4d8fff;}
.btn-submit.rm:hover{background:#6fa3ff;transform:translateY(-1px);}
.btn-submit:disabled{opacity:.5;cursor:not-allowed;transform:none!important;}
.spinner{width:14px;height:14px;border:2px solid rgba(0,0,0,.3);border-top-color:#000;border-radius:50%;animation:spin .6s linear infinite;display:none;}
.spinner.show{display:block;}
@keyframes spin{to{transform:rotate(360deg)}}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);color:#000;font-family:var(--mono);font-size:12px;font-weight:600;padding:12px 24px;border-radius:40px;transition:transform .3s cubic-bezier(.34,1.56,.64,1);letter-spacing:.05em;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw;text-align:center;}
.toast.show{transform:translateX(-50%) translateY(0);}
.toast.success{background:var(--accent);}
.toast.error{background:var(--warn);color:#fff;}
</style>
</head>
<body>

<div class="header">
  <div style="display:flex;align-items:center;gap:10px;">
    <span class="logo">RACK//ENTRY</span>
    <span style="color:var(--muted)">|</span>
    <span class="sid" id="sid">SES-000000</span>
  </div>
  <div class="live"><div class="dot"></div>LIVE</div>
</div>

<div class="main">
  <div class="sec-lbl">Tipe Racking</div>
  <div class="type-selector">
    <button class="type-btn" id="btn-fg" onclick="setType('FG')">
      Racking FG
      <span class="type-label">Finished Goods → Sheets FG</span>
    </button>
    <button class="type-btn" id="btn-rm" onclick="setType('RM')">
      Racking RM/PM
      <span class="type-label">Raw Material / Packaging → Sheets RM</span>
    </button>
  </div>

  <div class="form-body locked" id="form-body">
    <div class="lock-hint">
      <div class="lock-box">
        <div class="lock-icon">🔒</div>
        <div class="lock-txt">Pilih tipe racking dulu</div>
      </div>
    </div>

    <div class="sec-lbl">Info Sesi</div>
    <div class="meta-row">
      <div class="field">
        <label>Operator</label>
        <input type="text" id="op-name" placeholder="Nama operator...">
      </div>
      <div class="field">
        <label>Tanggal</label>
        <input type="text" id="tgl" readonly>
      </div>
    </div>

    <div class="sec-lbl">Item Racking</div>
    <div class="items-wrap" id="items-wrap"></div>
    <button class="btn-add-item" onclick="addItem()">+ Tambah Item</button>

    <div class="summary-bar">
      <div class="summary-stats">
        <div><div class="stat-val" id="tot-items">0</div><div class="stat-lbl">ITEM</div></div>
        <div><div class="stat-val" id="tot-bins">0</div><div class="stat-lbl">BIN</div></div>
        <div><div class="stat-val" id="tot-qty">0</div><div class="stat-lbl">TOTAL QTY</div></div>
      </div>
      <button class="btn-submit fg" id="btn-submit" onclick="submitSesi()">
        <div class="spinner" id="spinner"></div>
        <span id="submit-label">Submit Sesi →</span>
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxFKVrzvGM_Lj8FITKLme-1KOQ90L3rGXjttibqwPs0AXPQoI2BTTrHEmx_cW75L8P0Ng/exec";

const ZONA_CONFIG = {
  regular: { rows:40, cols:14, hasSide:true },
  AC:      { rows:10, cols:8,  hasSide:true },
  GB:      { rows:30, cols:5,  hasSide:false }
};
const ZONES_FG = [...'ABCDEFG','T'];
const ZONES_RM = [...'GHIJKLMNOPQRS','AC','GB'];

function getZoneType(z){ return z==='AC'?'AC':z==='GB'?'GB':'regular'; }

let currentType = null;
let itemCount = 0;
// itemBins[id] = Map<binCode, qty>
const itemBins = {};

function genSID(){ return 'SES-'+Date.now().toString(36).toUpperCase().slice(-6); }
let sessionId = genSID();
document.getElementById('sid').textContent = sessionId;
document.getElementById('tgl').value = new Date().toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});

function setType(type){
  currentType = type;
  document.getElementById('btn-fg').className='type-btn'+(type==='FG'?' active-fg':'');
  document.getElementById('btn-rm').className='type-btn'+(type==='RM'?' active-rm':'');
  document.getElementById('form-body').classList.remove('locked');
  const sb = document.getElementById('btn-submit');
  sb.className = 'btn-submit '+(type==='FG'?'fg':'rm');
  document.getElementById('submit-label').textContent=`Submit ke Sheets ${type} →`;
  document.getElementById('items-wrap').innerHTML='';
  Object.keys(itemBins).forEach(k=>delete itemBins[k]);
  itemCount=0;
  updateSummary();
  addItem();
}

function makeOpts(arr,padLen){ return arr.map(v=>{const l=padLen?String(v).padStart(padLen,'0'):v;return `<option value="${l}">${l}</option>`;}).join(''); }
function rowOpts(max){ return makeOpts(Array.from({length:max},(_,i)=>i+1),2); }
function colOpts(max){ return makeOpts(Array.from({length:max},(_,i)=>i+1),2); }
function getZones(){ return currentType==='FG'?ZONES_FG:ZONES_RM; }

function getSideHtml(id,hasSide){
  return hasSide
    ? `<div class="drill-field">
        <div class="drill-lbl">Sisi</div>
        <div class="side-btns">
          <button class="btn-side" onclick="addBin(${id},'A')">A</button>
          <button class="btn-side" onclick="addBin(${id},'B')">B</button>
          <button class="btn-side btn-side-both" onclick="addBinBoth(${id})">A+B</button>
        </div>
       </div>`
    : `<div class="drill-field" style="align-self:flex-end;">
        <button class="btn-add-bin-single" onclick="addBin(${id},null)">+ Tambah Bin</button>
       </div>`;
}

function addItem(){
  itemCount++;
  const id = itemCount;
  itemBins[id] = new Map(); // bin -> qty

  const zones = getZones();
  const firstZone = zones[0];
  const cfg = ZONA_CONFIG[getZoneType(firstZone)];
  const zoneOpts = zones.map(z=>`<option value="${z}">${z}</option>`).join('');

  const extraField = currentType==='RM'
    ? `<div class="field"><label>Supplier</label><input type="text" id="extra-${id}" placeholder="Isi nama supplier..."></div>`
    : `<div class="field"><label>Batch</label><input type="text" id="extra-${id}" placeholder="Isi nomor batch..."></div>`;

  const card = document.createElement('div');
  card.className='item-card';
  card.id='item-'+id;
  card.innerHTML=`
    <div class="item-hdr">
      <span class="item-num ${currentType==='FG'?'fg':'rm'}">ITEM #${String(id).padStart(2,'0')} · ${currentType}</span>
      <button class="btn-rm-item" onclick="removeItem(${id})">×</button>
    </div>
    <div class="item-body">
      <div class="item-fields">
        <div class="item-fields-row">
          <div class="field"><label>Nama Barang</label><input type="text" id="barang-${id}" placeholder="Isi nama barang..."></div>
          <div class="field"><label>Qty / Bin</label><input type="number" class="default-qty-input" id="dqty-${id}" value="1" min="1" style="width:100%"></div>
        </div>
        ${extraField}
      </div>
      <div class="bin-selector">
        <div class="drill-row" id="drill-${id}">
          <div class="drill-field">
            <div class="drill-lbl">Rak</div>
            <select class="drill-sel" id="dz-${id}" onchange="onRakChange(${id})">${zoneOpts}</select>
          </div>
          <div class="drill-field">
            <div class="drill-lbl">Row</div>
            <select class="drill-sel" id="dr-${id}">${rowOpts(cfg.rows)}</select>
          </div>
          <div class="drill-field">
            <div class="drill-lbl">Kolom</div>
            <select class="drill-sel" id="dc-${id}">${colOpts(cfg.cols)}</select>
          </div>
          <div class="drill-field" id="side-wrap-${id}">
            ${getSideHtml(id,cfg.hasSide)}
          </div>
        </div>
        <div class="rak-info" id="rinfo-${id}">
          <span>${firstZone}</span> — ${cfg.rows} row × ${cfg.cols} kolom${cfg.hasSide?' × A/B':''}
        </div>
        <div class="bins-review">
          <div class="bins-review-lbl">Bin terpilih & qty</div>
          <div id="bins-${id}"><span class="bins-empty">Belum ada bin dipilih</span></div>
          <div class="bin-tally">Total: <span id="tally-${id}">0</span> bin · <span id="tally-qty-${id}">0</span> qty</div>
        </div>
      </div>
    </div>`;
  document.getElementById('items-wrap').appendChild(card);
  updateSummary();
}

function onRakChange(id){
  const zona=document.getElementById('dz-'+id).value;
  const typeKey=getZoneType(zona);
  itemBins[id]=new Map();
  renderBins(id);
  const cfg=ZONA_CONFIG[typeKey];
  document.getElementById('dr-'+id).innerHTML=rowOpts(cfg.rows);
  document.getElementById('dc-'+id).innerHTML=colOpts(cfg.cols);
  document.getElementById('rinfo-'+id).innerHTML=`<span>${zona}</span> — ${cfg.rows} row × ${cfg.cols} kolom${cfg.hasSide?' × A/B':''}`;
  document.getElementById('side-wrap-'+id).innerHTML=getSideHtml(id,cfg.hasSide);
  updateSummary();
}

function getBinCode(id,sisi){
  const z=document.getElementById('dz-'+id).value;
  const r=document.getElementById('dr-'+id).value;
  const c=document.getElementById('dc-'+id).value;
  return sisi?`${z}-${r}-${c}-${sisi}`:`${z}-${r}-${c}`;
}

function getDefaultQty(id){
  return parseInt(document.getElementById('dqty-'+id)?.value||1)||1;
}

function addBin(id,sisi){
  const bin=getBinCode(id,sisi);
  if(itemBins[id].has(bin)) return;
  itemBins[id].set(bin, getDefaultQty(id));
  // Auto-increment kolom
  autoIncrementKolom(id);
  renderBins(id);
  updateSummary();
}

function addBinBoth(id){
  const binA=getBinCode(id,'A');
  const binB=getBinCode(id,'B');
  const qty=getDefaultQty(id);
  if(!itemBins[id].has(binA)) itemBins[id].set(binA,qty);
  if(!itemBins[id].has(binB)) itemBins[id].set(binB,qty);
  // Auto-increment kolom
  autoIncrementKolom(id);
  renderBins(id);
  updateSummary();
}

function autoIncrementKolom(id){
  const dcEl=document.getElementById('dc-'+id);
  if(!dcEl) return;
  const currentIdx=dcEl.selectedIndex;
  if(currentIdx < dcEl.options.length - 1){
    dcEl.selectedIndex = currentIdx + 1;
  }
}

function removeBin(id,bin){
  itemBins[id].delete(bin);
  renderBins(id);
  updateSummary();
}

function updateBinQty(id,bin,val){
  const qty=parseInt(val)||1;
  itemBins[id].set(bin,qty);
  updateSummary();
  // update tally inline
  const total=[...itemBins[id].values()].reduce((a,b)=>a+b,0);
  const tallyQty=document.getElementById('tally-qty-'+id);
  if(tallyQty) tallyQty.textContent=total;
}

function renderBins(id){
  const container=document.getElementById('bins-'+id);
  const tally=document.getElementById('tally-'+id);
  const tallyQty=document.getElementById('tally-qty-'+id);
  const bins=[...itemBins[id].keys()].sort();

  if(bins.length===0){
    container.innerHTML='<span class="bins-empty">Belum ada bin dipilih</span>';
  } else {
    container.innerHTML=bins.map(b=>{
      const qty=itemBins[id].get(b);
      return `<div class="bin-review-row">
        <span class="bin-code">${b}</span>
        <span class="bin-qty-lbl">qty</span>
        <input type="number" class="bin-qty-input" value="${qty}" min="1"
          onchange="updateBinQty(${id},'${b}',this.value)"
          oninput="updateBinQty(${id},'${b}',this.value)">
        <button class="btn-rm-bin" onclick="removeBin(${id},'${b}')">×</button>
      </div>`;
    }).join('');
  }

  tally.textContent=bins.length;
  const totalQty=[...itemBins[id].values()].reduce((a,b)=>a+b,0);
  if(tallyQty) tallyQty.textContent=totalQty;
}

function removeItem(id){
  const el=document.getElementById('item-'+id);
  if(el){el.style.opacity='0';el.style.transform='translateY(-6px)';el.style.transition='all .15s';setTimeout(()=>el.remove(),150);}
  delete itemBins[id];
  setTimeout(updateSummary,160);
}

function updateSummary(){
  let tI=0,tB=0,tQ=0;
  document.querySelectorAll('.item-card').forEach(card=>{
    const id=card.id.replace('item-','');
    const map=itemBins[id];
    if(!map) return;
    const bins=map.size;
    const qty=[...map.values()].reduce((a,b)=>a+b,0);
    if(bins>0){tI++;tB+=bins;tQ+=qty;}
  });
  document.getElementById('tot-items').textContent=tI;
  document.getElementById('tot-bins').textContent=tB;
  document.getElementById('tot-qty').textContent=tQ;
}

function showToast(msg,type='success'){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.className=`toast ${type} show`;
  setTimeout(()=>t.className=`toast ${type}`,4000);
}

function setLoading(on){
  const btn=document.getElementById('btn-submit');
  const spinner=document.getElementById('spinner');
  btn.disabled=on;
  spinner.className=on?'spinner show':'spinner';
  document.getElementById('submit-label').textContent=on?'Mengirim...':`Submit ke Sheets ${currentType} →`;
}

async function submitSesi(){
  const op=document.getElementById('op-name').value.trim();
  if(!op){showToast('Isi nama operator dulu!','error');return;}

  const rows=[];
  const ts=new Date().toLocaleDateString('id-ID')+' '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});

  document.querySelectorAll('.item-card').forEach(card=>{
    const id=card.id.replace('item-','');
    const barang=document.getElementById('barang-'+id)?.value.trim()||'-';
    const extraEl=document.getElementById('extra-'+id);
    const extra=extraEl?extraEl.value.trim()||'-':'-';
    const map=itemBins[id];
    if(!map) return;
    [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([bin,qty])=>{
      const row = {
        timestamp:ts, sessionId:sessionId, operator:op,
        tipe:currentType, bin, barang, qty:String(qty)
      };
      if(currentType==='RM') row.supplier = extra;
      if(currentType==='FG') row.batch = extra;
      rows.push(row);
    });
  });

  console.log('PAYLOAD:', JSON.stringify({tipe:currentType, rows}));
  if(rows.length===0){showToast('Pilih minimal 1 bin dulu!','error');return;}

  setLoading(true);
  try{
    const res=await fetch(APPS_SCRIPT_URL,{method:'POST',body:JSON.stringify({tipe:currentType,rows})});
    const result=await res.json();
    if(result.status==='ok'){
      showToast(`✓ ${result.written} baris tersimpan ke Sheets ${currentType}`,'success');
      setTimeout(()=>{
        sessionId=genSID();
        document.getElementById('sid').textContent=sessionId;
        document.getElementById('items-wrap').innerHTML='';
        Object.keys(itemBins).forEach(k=>delete itemBins[k]);
        itemCount=0;
        updateSummary();
        addItem();
      },1500);
    } else {
      showToast('Gagal: '+(result.message||'Error tidak diketahui'),'error');
    }
  } catch(err){
    showToast('Koneksi gagal — coba submit ulang','error');
  } finally{
    setLoading(false);
  }
}
</script>
