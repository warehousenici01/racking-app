<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lembur Form - Cyberpunk Edition</title>
  
  <!-- Font Google & Icon -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Libre+Barcode+39+Text&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  
  <!-- Library buat fitur Download Tiket jadi PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    /* =========================================
       1. TEMA DARK NEON
       ========================================= */
    body { font-family: 'Poppins', sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
    .form-container { max-width: 450px; margin: 20px auto; background: #1e1e1e; padding: 30px; border-radius: 15px; border: 1px solid #333; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }
    .title { text-align: center; font-weight: 700; color: #00f3ff; text-shadow: 0 0 5px #00f3ff, 0 0 15px #00f3ff; margin-bottom: 5px; font-size: 26px; letter-spacing: 2px; }
    .subtitle { text-align: center; color: #888; font-size: 13px; margin-bottom: 30px; letter-spacing: 1px; }

    /* Susunan Form ke Bawah (Original Layout) */
    .input-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #bbb; margin-bottom: 8px; }
    label i { margin-right: 8px; color: #00f3ff; text-shadow: 0 0 8px #00f3ff; }

    input, select, textarea { width: 100%; padding: 12px 15px; background-color: #2a2a2a; color: #00f3ff; border: 1px solid #444; border-radius: 8px; font-size: 14px; transition: 0.3s; box-sizing: border-box; }
    input:focus, select:focus, textarea:focus { border-color: #00f3ff; outline: none; box-shadow: 0 0 12px rgba(0, 243, 255, 0.4); background-color: #222; }
    input[readonly] { background-color: #1a1a1a; color: #888; border-color: #333; cursor: not-allowed; }

    /* Custom Checkbox Neon */
    .checkbox-container { display: flex; align-items: center; margin-bottom: 20px; cursor: pointer; font-size: 14px; color: #00f3ff; font-weight: 600; text-shadow: 0 0 5px rgba(0,243,255,0.5); }
    .checkbox-container input { display: none; }
    .checkmark { width: 22px; height: 22px; background: #2a2a2a; border: 2px solid #444; border-radius: 5px; margin-right: 10px; display: flex; justify-content: center; align-items: center; transition: 0.3s; }
    .checkbox-container input:checked + .checkmark { background: #00f3ff; border-color: #00f3ff; box-shadow: 0 0 10px #00f3ff; }
    .checkbox-container input:checked + .checkmark::after { content: '\f00c'; font-family: 'Font Awesome 6 Free'; font-weight: 900; color: #000; font-size: 14px; }

    /* Ikon Kalender biar putih/nyala di Dark Mode */
    ::-webkit-calendar-picker-indicator { filter: invert(1) drop-shadow(0 0 3px #00f3ff); cursor: pointer; }

    .btn-submit { width: 100%; padding: 14px; background-color: transparent; color: #00f3ff; border: 2px solid #00f3ff; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; text-shadow: 0 0 5px #00f3ff; box-shadow: 0 0 10px rgba(0, 243, 255, 0.2), inset 0 0 10px rgba(0, 243, 255, 0.1); }
    .btn-submit:hover:not(:disabled) { background-color: #00f3ff; color: #000; text-shadow: none; box-shadow: 0 0 20px #00f3ff; transform: translateY(-2px); }
    .btn-submit:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Animasi Satpam NIK */
    .hidden { display: none !important; }
    .visible { display: block; animation: slideDown 0.5s ease forwards; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

    /* =========================================
       2. TAMPILAN TIKET CYBERPUNK
       ========================================= */
    #ticket-wrapper { max-width: 450px; margin: 20px auto; }
    
    .ticket-card { background: linear-gradient(135deg, #0d1117 0%, #161b22 100%); border: 2px dashed #00f3ff; border-radius: 10px; padding: 25px; position: relative; color: #c9d1d9; box-shadow: 0 0 25px rgba(0, 243, 255, 0.2); overflow: hidden; }
    .ticket-card::before { content: "APPROVED"; position: absolute; top: 40px; right: -20px; transform: rotate(45deg); font-size: 20px; font-weight: 900; color: rgba(0, 243, 255, 0.1); letter-spacing: 5px; }

    .ticket-header { text-align: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 15px; }
    .ticket-header h3 { margin: 0; color: #00f3ff; font-weight: 800; letter-spacing: 2px; }
    .ticket-header p { margin: 5px 0 0 0; font-size: 11px; color: #8b949e; }
    
    .ticket-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 13px; }
    .ticket-label { color: #8b949e; }
    .ticket-value { color: #fff; font-weight: 600; text-align: right; max-width: 60%; }
    .ticket-value.neon { color: #00f3ff; text-shadow: 0 0 5px rgba(0,243,255,0.5); font-size: 15px;}
    
    .barcode { font-family: 'Libre Barcode 39 Text', cursive; font-size: 45px; text-align: center; color: #00f3ff; margin-top: 20px; text-shadow: 0 0 10px rgba(0, 243, 255, 0.4); }

    .btn-download { background-color: #2ea043; border-color: #2ea043; color: white; margin-top: 20px; box-shadow: 0 0 10px rgba(46, 160, 67, 0.4); text-shadow: none;}
    .btn-download:hover { background-color: #3fb950; box-shadow: 0 0 20px rgba(63, 185, 80, 0.6); }
  </style>
</head>
<body>

<!-- FORM UTAMA -->
<div class="form-container" id="form-wrapper">
  <h2 class="title">LEMBUR // ENTRY</h2>
  <p class="subtitle">SYSTEM TERMINAL WAREHOUSE</p>
  
  <form id="form-lembur">
    
    <!-- 1. Input NIK & Nama -->
    <div class="input-group">
      <label for="nik"><i class="fas fa-id-card"></i> Masukkan NIK</label>
      <input type="text" id="nik" name="nik" placeholder="Ketik 8 digit NIK (misal: 50106074)" maxlength="8" autocomplete="off" required>
    </div>
    
    <div id="loading-nik" class="hidden" style="text-align: center; color: #00f3ff; font-size: 13px; font-weight: 600; margin-bottom: 20px; text-shadow: 0 0 5px #00f3ff;">
      <i class="fas fa-spinner fa-spin"></i> SYSTEM MEMPROSES...
    </div>

    <!-- 2. Form Detail Lembur (Awalnya Sembunyi) -->
    <div id="form-detail-lembur" class="hidden">
      
      <div class="input-group">
        <label for="nama"><i class="fas fa-user"></i> Nama Karyawan</label>
        <input type="text" id="nama" name="nama" readonly>
      </div>

      <hr style="border: 0; border-top: 1px solid #333; margin: 25px 0;">
      
      <!-- Layout Original: Tanggal dan Jam berjejer ke bawah -->
      <div class="input-group">
        <label for="tanggal"><i class="fas fa-calendar-alt"></i> Tanggal Lembur (Auto-set)</label>
        <input type="date" id="tanggal" name="tanggal" required>
      </div>

      <div class="input-group">
        <label for="jamMulai"><i class="fas fa-clock"></i> Jam Mulai</label>
        <select id="jamMulai" name="jam_mulai" required></select>
      </div>
      
      <div class="input-group">
        <label for="jamSelesai"><i class="fas fa-history"></i> Jam Selesai</label>
        <select id="jamSelesai" name="jam_selesai" required></select>
      </div>

      <!-- Checkbox Istirahat -->
      <label class="checkbox-container">
        <input type="checkbox" id="isIstirahat" name="is_istirahat">
        <span class="checkmark"></span>
        Termasuk Jam Istirahat (Potong 1 Jam)
      </label>

      <!-- Display Durasi Lembur -->
      <div class="input-group">
        <label for="durasiDisplay"><i class="fas fa-stopwatch"></i> Total Durasi Lembur</label>
        <input type="text" id="durasiDisplay" name="durasi_display" value="0 Jam 0 Menit" readonly style="font-weight: bold; color: #00f3ff; text-shadow: 0 0 5px rgba(0,243,255,0.4);">
        <input type="hidden" id="durasiValue" name="durasi_value">
      </div>

      <div class="input-group">
        <label for="alasan"><i class="fas fa-edit"></i> Pekerjaan / Alasan</label>
        <textarea id="alasan" name="alasan" rows="3" placeholder="Contoh: Bongkar RM PM FG..." required></textarea>
      </div>

      <button type="submit" class="btn-submit"><i class="fas fa-satellite-dish"></i> TRANSMIT DATA</button>
    </div>
  </form>
</div>

<!-- TIKET HASIL REPORT -->
<div id="ticket-wrapper" class="hidden">
  
  <div class="ticket-card" id="ticket-content">
    <div class="ticket-header">
      <h3>OVERTIME CLEARANCE</h3>
      <p>WAREHOUSE TERMINAL SYSTEM</p>
    </div>
    
    <div class="ticket-row">
      <span class="ticket-label">TICKET ID</span>
      <span class="ticket-value" id="t-id">#WH-000</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">NAMA</span>
      <span class="ticket-value" id="t-nama">-</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">NIK</span>
      <span class="ticket-value" id="t-nik">-</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">TANGGAL</span>
      <span class="ticket-value" id="t-tgl">-</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">WAKTU</span>
      <span class="ticket-value" id="t-waktu">-</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">DURASI</span>
      <span class="ticket-value neon" id="t-durasi">-</span>
    </div>
    <div class="ticket-row">
      <span class="ticket-label">PEKERJAAN</span>
      <span class="ticket-value" id="t-alasan" style="font-size: 11px;">-</span>
    </div>
    
    <div class="barcode" id="t-barcode">OVERTIME</div>
  </div>

  <button class="btn-submit btn-download" onclick="downloadTicket()"><i class="fas fa-download"></i> Unduh Tiket (PNG)</button>
  <button class="btn-submit" onclick="location.reload()" style="background: #333; border-color: #555; color: #fff; text-shadow: none; box-shadow: none; margin-top: 10px;"><i class="fas fa-redo"></i> Input Laporan Baru</button>
</div>

<script>
  // ==========================================
  // MASUKIN URL WEB APP GOOGLE SCRIPT LU DI SINI
  // ==========================================
  const APPS_SCRIPT_URL = "https://script.google.com/macros/s/GANTI_PAKE_URL_LU_YANG_ASLI/exec";

  // ==========================================
  // DATABASE KARYAWAN LU (Bisa ditambahin terus)
  // ==========================================
  const databaseKaryawan = {
    "50106074": "Rizki Y. Latief",
    "50111075": "Parhan Baehaki",
    "50123456": "Asep Sunandar"
    // Format: "NIK" : "Nama Lengkap",
  };

  const formWrapper = document.getElementById("form-wrapper");
  const ticketWrapper = document.getElementById("ticket-wrapper");

  // FITUR: TANGGAL OTOMATIS (Mundur 1 hari kalau jam 01-09 pagi)
  function setTanggalOtomatis() {
    const tglInput = document.getElementById("tanggal");
    let now = new Date();
    let jamSekarang = now.getHours();

    if (jamSekarang < 9) {
      now.setDate(now.getDate() - 1);
    }
    
    const offset = now.getTimezoneOffset() * 60000;
    const localDate = new Date(now.getTime() - offset).toISOString().split('T')[0];
    tglInput.value = localDate;
  }

  // FITUR: GENERATE JAM KELIPATAN 30 MENIT
  function generateTimeOptions() {
    let options = '<option value="" disabled selected>-- Pilih Jam --</option>';
    for (let i = 0; i < 24; i++) {
      let h = i.toString().padStart(2, '0');
      options += `<option value="${h}:00">${h}:00</option>`;
      options += `<option value="${h}:30">${h}:30</option>`;
    }
    document.getElementById("jamMulai").innerHTML = options;
    document.getElementById("jamSelesai").innerHTML = options;
  }

  // FITUR: HITUNG DURASI & POTONG ISTIRAHAT
  function hitungDurasi() {
    const mulai = document.getElementById("jamMulai").value;
    const selesai = document.getElementById("jamSelesai").value;
    const isIstirahat = document.getElementById("isIstirahat").checked;
    
    if (!mulai || !selesai) return; 

    let [h1, m1] = mulai.split(':').map(Number);
    let [h2, m2] = selesai.split(':').map(Number);

    let menitMulai = (h1 * 60) + m1;
    let menitSelesai = (h2 * 60) + m2;

    if (menitSelesai <= menitMulai) {
      menitSelesai += (24 * 60); 
    }

    let selisihMenit = menitSelesai - menitMulai;

    if (isIstirahat) selisihMenit -= 60;
    if (selisihMenit < 0) selisihMenit = 0;

    let totalJam = Math.floor(selisihMenit / 60);
    let sisaMenit = selisihMenit % 60;

    document.getElementById("durasiDisplay").value = `${totalJam} Jam ${sisaMenit} Menit`;
    document.getElementById("durasiValue").value = selisihMenit; 
  }

  document.getElementById("jamMulai").addEventListener("change", hitungDurasi);
  document.getElementById("jamSelesai").addEventListener("change", hitungDurasi);
  document.getElementById("isIstirahat").addEventListener("change", hitungDurasi);

  // FITUR: SATPAM NIK
  document.getElementById("nik").addEventListener("input", function() {
    const nikUser = this.value.trim();
    const formDetail = document.getElementById("form-detail-lembur");
    const loading = document.getElementById("loading-nik");
    
    if (nikUser.length < 8) { formDetail.className = "hidden"; return; }

    if (nikUser.length === 8) {
      loading.className = "visible"; 
      setTimeout(() => {
        loading.className = "hidden"; 
        if (databaseKaryawan[nikUser]) {
          document.getElementById("nama").value = databaseKaryawan[nikUser];
          setTanggalOtomatis(); 
          generateTimeOptions(); 
          formDetail.className = "visible"; 
        } else {
          alert("❌ AKSES DITOLAK: NIK tidak terdaftar di sistem!");
          this.value = "";
          formDetail.className = "hidden";
        }
      }, 600); 
    }
  });

  // FITUR: SUBMIT & MUNCULIN TIKET
  document.getElementById("form-lembur").addEventListener("submit", async function(e) {
    e.preventDefault(); 
    
    const btnSubmit = document.querySelector("#form-detail-lembur .btn-submit");
    const textAsli = btnSubmit.innerHTML;
    btnSubmit.innerHTML = '<i class="fas fa-spinner fa-spin"></i> TRANSMITTING DATA...';
    btnSubmit.disabled = true;

    const form = document.getElementById("form-lembur");
    const formData = new FormData(form);

    try {
      // 1. KIRIM DATA KE SPREADSHEET
      await fetch(APPS_SCRIPT_URL, { method: 'POST', body: formData });
      
      // 2. BIKIN TIKET KALAU SUKSES
      const inputNik = document.getElementById("nik").value;
      const inputNama = document.getElementById("nama").value;
      
      // Ubah format tanggal YYYY-MM-DD jadi DD-MM-YYYY
      const inputTglAsli = document.getElementById("tanggal").value;
      const [tahun, bulan, hari] = inputTglAsli.split("-");
      const formatTglTiket = `${hari}-${bulan}-${tahun}`;

      const inputMulai = document.getElementById("jamMulai").value;
      const inputSelesai = document.getElementById("jamSelesai").value;
      const inputDurasi = document.getElementById("durasiDisplay").value;
      const inputAlasan = document.getElementById("alasan").value;
      const isIstirahat = document.getElementById("isIstirahat").checked;

      const d = new Date();
      const ticketId = `WH-${d.getDate()}${d.getMonth()+1}-${d.getHours()}${d.getMinutes()}${d.getSeconds()}`;
      
      document.getElementById("t-id").innerText = ticketId;
      document.getElementById("t-nama").innerText = inputNama;
      document.getElementById("t-nik").innerText = inputNik;
      document.getElementById("t-tgl").innerText = formatTglTiket;
      document.getElementById("t-waktu").innerText = `${inputMulai} - ${inputSelesai} ${isIstirahat ? '(-1 Jam Istirahat)' : ''}`;
      document.getElementById("t-durasi").innerText = inputDurasi;
      document.getElementById("t-alasan").innerText = inputAlasan;
      document.getElementById("t-barcode").innerText = ticketId;

      // Munculin tiket
      formWrapper.classList.add("hidden");
      ticketWrapper.classList.remove("hidden");
      ticketWrapper.classList.add("visible");
      
    } catch (error) {
      alert("❌ GAGAL MENGIRIM DATA! Cek koneksi internet lu, Mas bre.");
    } finally {
      btnSubmit.innerHTML = textAsli;
      btnSubmit.disabled = false;
    }
  });

  // FITUR: DOWNLOAD PNG
  function downloadTicket() {
    const ticketElement = document.getElementById("ticket-content");
    html2canvas(ticketElement, {
      backgroundColor: "#121212", 
      scale: 2 
    }).then(canvas => {
      let image = canvas.toDataURL("image/png");
      let a = document.createElement("a");
      a.href = image;
      a.download = `Tiket-Lembur-${document.getElementById("t-nik").innerText}.png`;
      a.click();
    });
  }
</script>

</body>
</html>
